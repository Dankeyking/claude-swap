<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Chat mit Kontowechsel</title>
<style>
  :root {
    --bg: #faf9f7; --panel: #fff; --raised: #fff;
    --line: #e6e3dd; --line-soft: #efedE8;
    --ink: #1c1b19; --muted: #7a746a; --faint: #a29b90;
    --accent: #c96442; --accent-ink: #8f4429;
    --pill: #f2f0eb; --pill-hover: #e9e6df;
    --ok: #4a7c59; --warn: #b45309; --danger: #b42318;
    --shadow: 0 8px 28px rgba(28,27,25,.13), 0 1px 3px rgba(28,27,25,.07);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a18; --panel: #232220; --raised: #2b2926;
      --line: #38352f; --line-soft: #2f2d29;
      --ink: #efedE8; --muted: #a29b90; --faint: #7a746a;
      --accent: #d97757; --accent-ink: #e8a084;
      --pill: #2f2d29; --pill-hover: #3a3733;
      --shadow: 0 8px 28px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 15px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  button { font: inherit; color: inherit; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px; border-bottom: 1px solid var(--line-soft);
  }
  .mark { width: 17px; height: 17px; flex: none; color: var(--accent); }
  .spacer { flex: 1; }

  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: transparent; border: 1px solid transparent; border-radius: 999px;
    padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--muted);
    max-width: 340px; transition: background .12s, color .12s, border-color .12s;
  }
  .chip:hover { background: var(--pill); color: var(--ink); }
  .chip .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .acct {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--pill); border: 1px solid transparent; border-radius: 999px;
    padding: 5px 12px 5px 10px; cursor: pointer; font-size: 13px;
    transition: background .12s, border-color .12s;
  }
  .acct:hover:not(:disabled) { background: var(--pill-hover); }
  .acct[aria-current="true"] { background: var(--raised); border-color: var(--line); }
  .acct:disabled { cursor: default; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .acct[aria-current="true"] .dot { background: var(--ok); }
  .acct .pct { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .acct .pct.hot { color: var(--warn); }
  .acct .pct.full { color: var(--danger); }
  .total {
    font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums;
    padding: 0 4px; white-space: nowrap;
  }

  /* ---------- layout with history rail ---------- */
  .shell { flex: 1; display: flex; min-height: 0; }
  .stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .rail {
    width: 268px; flex: none; border-left: 1px solid var(--line-soft);
    display: flex; flex-direction: column; overflow: hidden;
  }
  body.no-rail .rail { display: none; }
  .rail h2 {
    font-size: 11.5px; font-weight: 500; color: var(--faint);
    margin: 0; padding: 14px 16px 8px; letter-spacing: .02em;
  }
  .rail .list { flex: 1; overflow-y: auto; padding: 0 8px 14px; }
  .railtop { padding: 0 12px 10px; display: grid; gap: 7px; }
  .railtop input {
    width: 100%; font: inherit; font-size: 13px; padding: 6px 9px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: inherit; outline: 0;
  }
  .railtop input:focus { border-color: var(--faint); }
  .seg { display: flex; background: var(--pill); border-radius: 8px; padding: 2px; }
  .seg button {
    flex: 1; border: 0; background: transparent; border-radius: 6px;
    padding: 4px 8px; font-size: 12.5px; color: var(--muted); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); }
  .newbtn {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    width: 100%; border: 1px solid var(--line); background: var(--panel);
    border-radius: 9px; padding: 8px 10px; font-size: 13.5px; cursor: pointer;
  }
  .newbtn:hover { background: var(--pill); }
  .newbtn svg { width: 15px; height: 15px; }
  .grp {
    font-size: 11px; color: var(--faint); padding: 12px 10px 4px;
    letter-spacing: .03em;
  }
  .grp:first-child { padding-top: 2px; }
  .conv .where {
    font-size: 11px; color: var(--faint); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .trunc {
    text-align: center; font-size: 12.5px; color: var(--muted);
    margin-bottom: 20px;
  }
  .trunc button {
    border: 1px solid var(--line); background: var(--panel); color: inherit;
    border-radius: 999px; padding: 4px 13px; font-size: 12.5px; cursor: pointer;
  }
  .trunc button:hover { border-color: var(--faint); }
  .conv {
    display: block; width: 100%; text-align: left; background: transparent;
    border: 0; border-radius: 9px; padding: 8px 10px; cursor: pointer;
    margin-bottom: 2px;
  }
  .conv:hover { background: var(--pill); }
  .conv[aria-current="true"] { background: var(--pill); }
  .conv .t {
    font-size: 13px; line-height: 1.35; overflow: hidden;
    text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .conv .d { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
  .rail .none { font-size: 12.5px; color: var(--faint); padding: 4px 10px; }

  /* ---------- chat ---------- */
  main { flex: 1; overflow-y: auto; }
  .col { max-width: 760px; margin: 0 auto; padding: 30px 24px 8px; }
  .turn { margin-bottom: 26px; }
  .turn.user { display: flex; justify-content: flex-end; }
  .turn.user .bubble {
    background: var(--pill); border-radius: 16px; padding: 10px 15px;
    max-width: 85%; white-space: pre-wrap; word-wrap: break-word;
  }
  .turn.claude .bubble { word-wrap: break-word; }
  .turn.claude .tools { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .toolchip {
    font-size: 11.5px; color: var(--muted); background: var(--pill);
    border-radius: 6px; padding: 2px 8px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  }

  /* markdown */
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md p { margin: 0 0 12px; }
  .md h3, .md h4, .md h5, .md h6 {
    margin: 22px 0 9px; font-weight: 600; line-height: 1.35;
  }
  .md h3 { font-size: 18px; }
  .md h4 { font-size: 16px; }
  .md h5, .md h6 { font-size: 14.5px; color: var(--muted); }
  .md ul, .md ol { margin: 0 0 12px; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md li > ul, .md li > ol { margin: 3px 0; }
  .md strong { font-weight: 600; }
  .md code {
    font: 400 .87em/1.4 ui-monospace, "Cascadia Code", Consolas, monospace;
    background: var(--pill); border-radius: 5px; padding: 1.5px 5px;
    word-break: break-word;
  }
  .md pre {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 0 0 12px;
    position: relative;
  }
  .copy {
    position: absolute; top: 7px; right: 7px; border: 1px solid var(--line);
    background: var(--bg); color: var(--muted); border-radius: 6px;
    padding: 3px 8px; font-size: 11.5px; cursor: pointer; opacity: 0;
    transition: opacity .12s, color .12s;
  }
  .md pre:hover .copy, .copy:focus-visible { opacity: 1; }
  .copy:hover { color: var(--ink); }
  .copy.done { color: var(--ok); opacity: 1; }
  .md pre code { background: none; padding: 0; font-size: 13px; line-height: 1.55; }
  .md blockquote {
    margin: 0 0 12px; padding: 2px 0 2px 14px;
    border-left: 2px solid var(--line); color: var(--muted);
  }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
  .md a { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 2px; }
  .md table {
    border-collapse: collapse; margin: 0 0 12px; font-size: 14px; display: block;
    overflow-x: auto; max-width: 100%;
  }
  .md th, .md td {
    border: 1px solid var(--line); padding: 6px 11px; text-align: left; vertical-align: top;
  }
  .md th { background: var(--pill); font-weight: 600; }
  .turn.note { text-align: center; }
  .turn.note .bubble {
    display: inline-block; font-size: 12.5px; color: var(--muted);
    background: var(--pill); border-radius: 999px; padding: 4px 13px;
  }
  .turn.note.bad .bubble { color: var(--danger); }
  .meta { font-size: 11.5px; color: var(--faint); margin-top: 7px;
          font-variant-numeric: tabular-nums; }
  .cursor::after {
    content: ""; display: inline-block; width: 7px; height: 15px;
    background: var(--ink); margin-left: 2px; vertical-align: -2px;
    animation: blink 1.1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .empty { text-align: center; color: var(--faint); padding-top: 14vh; font-size: 15px; }

  /* ---------- composer ---------- */
  footer { padding: 0 24px 22px; }
  .composer {
    max-width: 760px; margin: 0 auto; position: relative;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: 0 1px 2px rgba(28,27,25,.05);
    transition: border-color .12s;
  }
  .composer:focus-within { border-color: var(--faint); }
  .input-row { display: flex; align-items: flex-end; gap: 8px; padding: 12px 12px 0; }
  textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: transparent;
    color: inherit; font: inherit; padding: 2px 2px 4px; max-height: 220px;
    min-height: 26px; line-height: 1.55;
  }
  textarea::placeholder { color: var(--faint); }
  .send {
    flex: none; width: 30px; height: 30px; border-radius: 8px; border: 0;
    background: var(--accent); color: #fff; cursor: pointer; display: grid;
    place-items: center; transition: opacity .12s;
  }
  .send:disabled { opacity: .35; cursor: default; }
  .send svg { width: 15px; height: 15px; }
  .send.stop { background: var(--ink); }
  .send.stop svg { width: 11px; height: 11px; }

  .bar { display: flex; align-items: center; gap: 4px; padding: 6px 9px 9px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; background: transparent;
    border: 0; border-radius: 8px; padding: 5px 9px; cursor: pointer;
    font-size: 13px; color: var(--muted); transition: background .12s, color .12s;
  }
  .pill:hover, .pill[aria-expanded="true"] { background: var(--pill); color: var(--ink); }
  .pill.on { color: var(--ok); }
  .pill.warn { color: var(--danger); }
  .pill svg { width: 13px; height: 13px; opacity: .65; }

  /* ---------- popovers ---------- */
  .pop {
    position: absolute; bottom: calc(100% + 8px); z-index: 40; min-width: 250px;
    background: var(--raised); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow); padding: 6px;
    display: none; max-height: 60vh; overflow-y: auto;
  }
  .pop.open { display: block; }
  .pop.right { right: 0; }
  .pop.left { left: 0; }
  .pop h3 {
    font-size: 11.5px; font-weight: 500; color: var(--faint); margin: 0;
    padding: 7px 10px 5px; letter-spacing: .02em;
  }
  .item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: transparent; border: 0; border-radius: 8px; padding: 8px 10px;
    cursor: pointer; text-align: left; font-size: 13.5px;
  }
  .item:hover { background: var(--pill); }
  .item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sub { color: var(--faint); font-size: 12px; }
  .item .tick { width: 14px; color: var(--ink); flex: none; text-align: center; }
  .sep { height: 1px; background: var(--line-soft); margin: 5px 6px; }
  .hintline { font-size: 12px; color: var(--muted); padding: 4px 10px 8px; line-height: 1.45; }
  .hintline.bad { color: var(--danger); }

  #cmdPop { left: 0; right: 0; min-width: 0; max-height: 46vh; }
  .cmd {
    display: flex; align-items: baseline; gap: 10px; width: 100%;
    background: transparent; border: 0; border-radius: 8px; padding: 7px 10px;
    cursor: pointer; text-align: left;
  }
  .cmd[aria-selected="true"] { background: var(--pill); }
  .cmd .n {
    font-size: 13.5px; font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    white-space: nowrap;
  }
  .cmd .h {
    font-size: 12px; color: var(--faint); flex: 1; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; text-align: right;
  }

  .slider { padding: 10px 12px 6px; }
  .slider input { width: 100%; accent-color: var(--accent); }
  .slider .ends { display: flex; justify-content: space-between;
                  font-size: 11.5px; color: var(--faint); margin-top: 2px; }
  .pathrow { display: flex; gap: 6px; padding: 6px 6px 4px; }
  .pathrow input {
    flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 7px 9px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: inherit; outline: 0;
  }
  .pathrow input:focus { border-color: var(--faint); }
  .pathrow button {
    border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
    padding: 0 12px; cursor: pointer; font-size: 13px;
  }
  .pathrow button:hover { background: var(--pill); }
</style>
</head>
<body>

<header>
  <svg class="mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M12 2 13.9 8.4 20 6.6l-4.3 4.9L21 15l-6.3.3 1 6.2-3.7-5-3.7 5 1-6.2L3 15l5.3-3.5L4 6.6l6.1 1.8z"/>
  </svg>
  <button class="chip" id="dirChip" aria-expanded="false" aria-haspopup="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14" aria-hidden="true">
      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    </svg>
    <span class="path" id="dirLabel">…</span>
  </button>
  <div class="spacer"></div>
  <span class="total" id="total" title="Kosten dieser Sitzung"></span>
  <div id="accounts" style="display:flex;gap:6px"></div>
  <button class="chip" id="railToggle" title="Verlauf ein- oder ausblenden" aria-label="Verlauf">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         width="15" height="15" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h10"/>
    </svg>
  </button>
</header>

<div class="shell">
<div class="stage">
<main>
  <div class="col" id="log" aria-live="polite" aria-busy="false">
    <div class="empty" id="empty">Womit fangen wir an?</div>
  </div>
</main>

<footer>
  <form class="composer" id="form">
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Nachricht an Claude …"></textarea>
      <button class="send" id="send" type="submit" title="Senden" aria-label="Senden">
        <svg id="iconSend" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
        <svg id="iconStop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden>
          <rect x="5" y="5" width="14" height="14" rx="2.5"/>
        </svg>
      </button>
    </div>

    <div class="bar">
      <button type="button" class="pill" id="attachBtn" title="Hinzufügen"
              aria-label="Hinzufügen" aria-expanded="false" aria-haspopup="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button type="button" class="pill" id="modePill" aria-expanded="false" aria-haspopup="true">
        <span id="modeLabel">Auto</span>
      </button>
      <button type="button" class="pill" id="toolsPill" aria-expanded="false" aria-haspopup="true">
        <span id="toolsLabel">Nur Chat</span>
      </button>
      <div class="spacer"></div>
      <button type="button" class="pill" id="modelPill" aria-expanded="false" aria-haspopup="true">
        <span id="modelLabel">Standard</span>
      </button>
      <button type="button" class="pill" id="effortPill" aria-expanded="false" aria-haspopup="true">
        <span id="effortLabel">Standard</span>
      </button>
    </div>

    <!-- popovers -->
    <div class="pop left" id="attachPop" style="min-width:340px">
      <h3>Hinzufügen</h3>
      <button type="button" class="item" id="attachSlash">
        <span class="tick">/</span>
        <span class="label">Slash-Befehle</span>
      </button>
      <div class="sep"></div>
      <div class="pathrow">
        <input id="fileSearch" type="search" spellcheck="false"
               placeholder="Datei suchen …" aria-label="Datei suchen">
      </div>
      <div id="fileItems"></div>
      <div class="hintline" id="fileHint"></div>
    </div>

    <div class="pop" id="cmdPop" role="listbox" aria-label="Befehle">
      <h3>Befehle</h3>
      <div id="cmdItems"></div>
    </div>

    <div class="pop left" id="modePop">
      <h3>Modus</h3>
      <div id="modeItems"></div>
      <div class="sep"></div>
      <div class="hintline" id="modeHint"></div>
    </div>

    <div class="pop left" id="toolsPop">
      <h3>Werkzeuge</h3>
      <div id="toolsItems"></div>
    </div>

    <div class="pop right" id="modelPop">
      <h3>Modelle</h3>
      <div id="modelItems"></div>
    </div>

    <div class="pop right" id="effortPop">
      <h3>Aufwand</h3>
      <div class="slider">
        <input type="range" id="effortRange" min="0" max="5" step="1" value="0">
        <div class="ends"><span>Schneller</span><span>Intelligenter</span></div>
      </div>
      <div class="hintline" id="effortHint"></div>
    </div>

    <div class="pop left" id="dirPop" style="min-width:330px">
      <h3>Arbeitsverzeichnis</h3>
      <div id="dirItems"></div>
      <div class="sep"></div>
      <div class="pathrow">
        <input id="dirInput" type="text" spellcheck="false" placeholder="Pfad eingeben">
        <button type="button" id="dirGo">Los</button>
      </div>
      <div class="hintline" id="dirHint">Ein Wechsel startet ein neues Gespräch.</div>
    </div>
  </form>
</footer>
</div>

<aside class="rail">
  <div class="railtop" style="padding-top:12px">
    <button type="button" class="newbtn" id="newChat" title="Neues Gespräch (Alt+N)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Neu
    </button>
  </div>
  <h2>Verlauf</h2>
  <div class="railtop">
    <input id="convSearch" type="search" spellcheck="false"
           placeholder="Suchen … (Strg+K)" aria-label="Verlauf durchsuchen">
    <div class="seg" role="group" aria-label="Bereich">
      <button type="button" id="scopeDir" aria-pressed="true">Hier</button>
      <button type="button" id="scopeAll" aria-pressed="false">Alle</button>
    </div>
  </div>
  <div class="list" id="convs"></div>
</aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log");
let sessionId = null, busy = false, ctx = null;

// Quotes included: link URLs land inside an href attribute, so an unescaped
// quote in model output would otherwise break out of it.
const esc = (s) => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TICK = "✓";

/* ---------- option catalogue ---------- */

const MODELS = [
  { v: "", label: "Standard", sub: "" },
  { v: "opus", label: "Opus 5", sub: "am stärksten" },
  { v: "sonnet", label: "Sonnet 5", sub: "ausgewogen" },
  { v: "haiku", label: "Haiku 4.5", sub: "am schnellsten" },
  { v: "fable", label: "Fable 5", sub: "" },
];
const MODES = [
  { v: "", label: "Standard", sub: "fragt nach" },
  { v: "plan", label: "Plan", sub: "erst planen" },
  { v: "acceptEdits", label: "Bearbeitungen annehmen", sub: "" },
  { v: "dontAsk", label: "Nicht fragen", sub: "" },
];
const TOOLSETS = [
  { v: "none", label: "Nur Chat", sub: "keine Werkzeuge" },
  { v: "read", label: "Lesend", sub: "Read, Grep, Web" },
  { v: "all", label: "Alle Werkzeuge", sub: "" },
];
const EFFORTS = ["", "low", "medium", "high", "xhigh", "max"];
const EFFORT_LABEL = { "": "Standard", low: "Niedrig", medium: "Mittel",
                       high: "Hoch", xhigh: "Sehr hoch", max: "Maximal" };

const state = { model: "", mode: "", tools: "none", effort: "" };
for (const k of Object.keys(state)) {
  const saved = localStorage.getItem("ui." + k);
  if (saved !== null) state[k] = saved;
}
const save = (k) => localStorage.setItem("ui." + k, state[k]);

/* ---------- popovers ---------- */

const POPS = [["modePill", "modePop"], ["toolsPill", "toolsPop"],
              ["modelPill", "modelPop"], ["effortPill", "effortPop"],
              ["dirChip", "dirPop"], ["attachBtn", "attachPop"]];

function closePops(except) {
  for (const [pill, pop] of POPS) {
    if (pop === except) continue;
    $(pop).classList.remove("open");
    $(pill).setAttribute("aria-expanded", "false");
  }
}
for (const [pill, pop] of POPS) {
  $(pill).addEventListener("click", (e) => {
    e.stopPropagation();
    const open = $(pop).classList.contains("open");
    closePops();
    if (!open) { $(pop).classList.add("open"); $(pill).setAttribute("aria-expanded", "true"); }
  });
  $(pop).addEventListener("click", (e) => e.stopPropagation());
}
document.addEventListener("click", (e) => {
  closePops();
  if (!$("cmdPop").contains(e.target)) closeCmd();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePops(); });

/* The dir popover hangs off the header chip, so it needs its own anchoring. */
$("dirPop").style.bottom = "auto";
function placeDirPop() {
  const r = $("dirChip").getBoundingClientRect();
  Object.assign($("dirPop").style, { position: "fixed", top: (r.bottom + 6) + "px", left: r.left + "px" });
}
$("dirChip").addEventListener("click", placeDirPop);
addEventListener("resize", () => closePops());

/* ---------- rendering the menus ---------- */

function renderMenu(host, options, current, onPick) {
  host.innerHTML = "";
  for (const o of options) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "item";
    b.innerHTML = `<span class="tick">${o.v === current ? TICK : ""}</span>
                   <span class="label">${esc(o.label)}</span>
                   <span class="sub">${esc(o.sub || "")}</span>`;
    b.onclick = () => { onPick(o.v); closePops(); };
    host.appendChild(b);
  }
}

function syncPills() {
  $("modelLabel").textContent = MODELS.find(m => m.v === state.model).label;
  $("modeLabel").textContent = MODES.find(m => m.v === state.mode).label;
  $("toolsLabel").textContent = TOOLSETS.find(t => t.v === state.tools).label;
  $("effortLabel").textContent = EFFORT_LABEL[state.effort];
  $("effortRange").value = String(EFFORTS.indexOf(state.effort));
  $("effortHint").textContent = state.effort
    ? "Mehr Aufwand heißt langsamer, aber gründlicher."
    : "Claude wählt den Aufwand selbst.";

  renderMenu($("modelItems"), MODELS, state.model, v => { state.model = v; save("model"); syncPills(); });
  renderMenu($("modeItems"), MODES, state.mode, v => { state.mode = v; save("mode"); syncPills(); });
  renderMenu($("toolsItems"), TOOLSETS, state.tools, v => { state.tools = v; save("tools"); syncPills(); });

  // Only warn where the combination actually removes a guard rail.
  const hint = $("modeHint"), pill = $("modePill");
  pill.classList.remove("on", "warn"); hint.classList.remove("bad");
  if (state.tools === "none") {
    hint.textContent = state.mode === "plan"
      ? "Plan-Modus wirkt erst mit Werkzeugen."
      : "Ohne Werkzeuge hat der Modus keine Wirkung.";
  } else if (state.mode === "") {
    hint.textContent = "Rückfragen können hier nicht beantwortet werden — wähle einen Modus.";
    hint.classList.add("bad"); pill.classList.add("warn");
  } else if (state.mode === "dontAsk" && state.tools === "all") {
    hint.textContent = "Claude führt Befehle und Änderungen ohne Rückfrage aus.";
    hint.classList.add("bad"); pill.classList.add("warn");
  } else if (state.mode === "plan") {
    hint.textContent = "Claude plant nur, ohne etwas zu ändern."; pill.classList.add("on");
  } else { hint.textContent = ""; }
}

$("effortRange").oninput = (e) => {
  state.effort = EFFORTS[+e.target.value]; save("effort"); syncPills();
};

/* ---------- messages ---------- */

function addTurn(cls, text) {
  $("empty")?.remove();
  const t = document.createElement("div");
  t.className = "turn " + cls;
  const b = document.createElement("div");
  b.className = "bubble";
  if (cls === "claude") {
    b.innerHTML = '<div class="tools" hidden></div><div class="md"></div>';
    if (text) setMarkdown(b, text);
  } else if (text) {
    b.textContent = text;   // user and status lines stay literal
  }
  t.appendChild(b);
  log.appendChild(t);
  scrollDown();
  return b;
}

function setMarkdown(bubble, text) {
  bubble.querySelector(".md").innerHTML = md(text);
}

function addToolChip(bubble, name) {
  const box = bubble.querySelector(".tools");
  box.hidden = false;
  const c = document.createElement("span");
  c.className = "toolchip";
  c.textContent = name;
  box.appendChild(c);
}

/* ---------- markdown ----------
   Small on purpose: it renders what Claude actually emits (headings, lists,
   emphasis, code, tables, quotes, links) and nothing else. Everything is
   HTML-escaped *before* any markup is produced, so no model output can inject
   an element -- the only tags in the result are the ones built here. */

function inline(s) {
  return s
    .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,;:!?)]|$)/g, "$1<em>$2</em>")
    .replace(/(^|[\s(])_([^_\n]+)_(?=[\s.,;:!?)]|$)/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, url) =>
      /^https?:\/\//i.test(url) ? `<a href="${url}" target="_blank" rel="noopener">${label}</a>` : m);
}

function splitRow(line) {
  return line.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
}

function md(src) {
  src = String(src);
  // A fence still open mid-stream would otherwise render as literal text.
  if ((src.match(/```/g) || []).length % 2) src += "\n```";

  const codes = [];
  src = src.replace(/```([^\n`]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    codes.push(code.replace(/\n$/, ""));
    return `@@CODE${codes.length - 1}@@`;
  });

  const lines = esc(src).split("\n");
  const out = [];
  let list = null, para = [];
  const flush = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  const endList = () => { if (list) { out.push(`</${list}>`); list = null; } };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trimEnd();
    let m;

    if ((m = line.match(/^@@CODE(\d+)@@$/))) {
      flush(); endList();
      out.push(`<pre><code>${esc(codes[+m[1]])}</code></pre>`);
      continue;
    }
    if (!line.trim()) { flush(); endList(); continue; }

    // table: a header row followed by a |---|---| separator
    if (/\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      flush(); endList();
      const head = splitRow(line);
      let rows = "";
      i++;
      while (i + 1 < lines.length && /\|/.test(lines[i + 1]) && lines[i + 1].trim()) {
        rows += "<tr>" + splitRow(lines[++i]).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
      }
      out.push(`<table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead>`
             + `<tbody>${rows}</tbody></table>`);
      continue;
    }
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      flush(); endList();
      const level = Math.min(m[1].length + 2, 6);   // # renders as h3, never h1
      out.push(`<h${level}>${inline(m[2])}</h${level}>`);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flush(); endList(); out.push("<hr>"); continue; }
    if ((m = line.match(/^\s*[-*+•]\s+(.*)$/))) {
      flush();
      if (list !== "ul") { endList(); out.push("<ul>"); list = "ul"; }
      out.push(`<li>${inline(m[1])}</li>`);
      continue;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      flush();
      if (list !== "ol") { endList(); out.push("<ol>"); list = "ol"; }
      out.push(`<li>${inline(m[1])}</li>`);
      continue;
    }
    if ((m = line.match(/^&gt;\s?(.*)$/))) {
      flush(); endList();
      out.push(`<blockquote>${inline(m[1])}</blockquote>`);
      continue;
    }
    endList();
    para.push(line.trim());
  }
  flush(); endList();
  return out.join("");
}
/* Auto-scroll only while the user is already at the bottom. Forcing it on every
   chunk makes a long answer impossible to read: scroll up and you get yanked
   back down a moment later. */
const view = () => document.querySelector("main");
function atBottom() {
  const m = view();
  return m.scrollHeight - m.scrollTop - m.clientHeight < 130;
}
function scrollDown(force) {
  if (force || atBottom()) view().scrollTop = view().scrollHeight;
}

/* ---------- German number formats ---------- */

const fmtCost = new Intl.NumberFormat("de-DE", {
  style: "currency", currency: "USD",
  minimumFractionDigits: 4, maximumFractionDigits: 4,
});
const fmtCostTotal = new Intl.NumberFormat("de-DE", {
  style: "currency", currency: "USD",
  minimumFractionDigits: 2, maximumFractionDigits: 2,
});
const fmtSecs = new Intl.NumberFormat("de-DE", {
  minimumFractionDigits: 1, maximumFractionDigits: 1,
});

let sessionCost = 0;
function addCost(usd) {
  if (typeof usd !== "number") return;
  sessionCost += usd;
  $("total").textContent = "Sitzung " + fmtCostTotal.format(sessionCost);
}

/* Code blocks get a copy button once the turn is finished — adding them on
   every streamed chunk would rebuild them dozens of times for nothing. */
function addCopyButtons(bubble) {
  for (const pre of bubble.querySelectorAll("pre")) {
    if (pre.querySelector(".copy")) continue;
    const b = document.createElement("button");
    b.type = "button"; b.className = "copy"; b.textContent = "Kopieren";
    b.onclick = async () => {
      try {
        await navigator.clipboard.writeText(pre.querySelector("code").textContent);
        b.textContent = "Kopiert"; b.classList.add("done");
        setTimeout(() => { b.textContent = "Kopieren"; b.classList.remove("done"); }, 1600);
      } catch { b.textContent = "Fehlgeschlagen"; }
    };
    pre.appendChild(b);
  }
}

/* ---------- accounts ---------- */

function pctClass(p) { return p >= 90 ? "pct full" : p >= 75 ? "pct hot" : "pct"; }

async function loadAccounts() {
  let data;
  try { data = await (await fetch("/api/accounts")).json(); } catch { return; }
  const box = $("accounts");
  if (data.error) { box.textContent = ""; return; }
  box.innerHTML = "";
  for (const a of data.accounts || []) {
    const b = document.createElement("button");
    b.className = "acct";
    b.setAttribute("aria-current", a.active ? "true" : "false");
    b.disabled = a.active || busy;
    b.title = a.email || "";
    const p = a.usage?.fiveHour?.pct;
    b.innerHTML = `<span class="dot"></span>
      <span>${esc(a.alias || ("Konto " + a.number))}</span>
      ${typeof p === "number" ? `<span class="${pctClass(p)}">${Math.round(p)}%</span>` : ""}`;
    b.onclick = () => switchTo(a.alias || String(a.number), a.email);
    box.appendChild(b);
  }
}

async function switchTo(target, email) {
  if (busy) return;
  busy = true; loadAccounts();
  try {
    const res = await (await fetch("/api/switch", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ account: target }),
    })).json();
    if (res.error) addTurn("note bad", "Wechsel fehlgeschlagen: " + res.error);
    else addTurn("note", `Konto: ${email || target} — ab der nächsten Nachricht`);
  } catch (e) { addTurn("note bad", String(e)); }
  finally { busy = false; loadAccounts(); }
}

/* ---------- working directory ---------- */

function applyContext(d) {
  ctx = d;
  const parts = d.cwd.split(/[\\/]/);
  $("dirLabel").textContent = parts.slice(-2).join("\\") || d.cwd;
  $("dirChip").title = d.cwd;
  $("dirInput").value = d.cwd;

  const host = $("dirItems");
  host.innerHTML = "";
  if (d.parent) {
    const up = document.createElement("button");
    up.type = "button"; up.className = "item";
    up.innerHTML = `<span class="tick">↑</span><span class="label">übergeordnet</span>`;
    up.onclick = () => { closePops(); changeDir(d.parent); };
    host.appendChild(up);
  }
  for (const name of d.subdirs || []) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "item";
    b.innerHTML = `<span class="tick"></span><span class="label">${esc(name)}</span>`;
    b.onclick = () => { closePops(); changeDir(d.cwd.replace(/[\\/]$/, "") + "\\" + name); };
    host.appendChild(b);
  }
}

async function changeDir(path) {
  if (busy || !path) return;
  const hint = $("dirHint");
  try {
    const d = await (await fetch("/api/cwd", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cwd: path }),
    })).json();
    if (d.error) { hint.textContent = d.error; hint.classList.add("bad"); return; }
    hint.textContent = "Ein Wechsel startet ein neues Gespräch.";
    hint.classList.remove("bad");
    applyContext(d);
    // A conversation is filed under the directory it ran in, so it cannot be
    // resumed from another one. Start fresh rather than fail mid-turn.
    sessionId = null;
    addTurn("note", "Verzeichnis: " + d.cwd + " — neues Gespräch");
    loadConversations();   // history and commands are both per directory
    loadCommands();
  } catch (e) { hint.textContent = String(e); hint.classList.add("bad"); }
}

$("dirGo").onclick = () => { const v = $("dirInput").value.trim(); closePops(); changeDir(v); };
$("dirInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); $("dirGo").click(); }
});

/* ---------- sending ---------- */

let inflight = null;   // AbortController of the running turn

function setBusy(on) {
  busy = on;
  $("send").classList.toggle("stop", on);
  $("send").title = on ? "Abbrechen" : "Senden";
  $("send").setAttribute("aria-label", on ? "Abbrechen" : "Senden");
  $("iconSend").hidden = on;
  $("iconStop").hidden = !on;
  $("log").setAttribute("aria-busy", String(on));
}

$("send").addEventListener("click", (e) => {
  // While a turn runs the same button aborts it. Dropping the connection makes
  // the server kill the child, so a stopped answer stops costing quota.
  if (busy && inflight) { e.preventDefault(); inflight.abort(); }
});

$("form").onsubmit = async (ev) => {
  ev.preventDefault();
  const input = $("input");
  const text = input.value.trim();
  if (!text || busy) return;
  closePops();

  addTurn("user", text);
  input.value = ""; input.style.height = "auto";
  setBusy(true); loadAccounts(); scrollDown(true);

  const bubble = addTurn("claude", "");
  const body = bubble.querySelector(".md");
  body.classList.add("cursor");
  let acc = "", meta = null, resolved = null, aborted = false;

  // Re-parsing the whole answer on every chunk is quadratic; coalescing to one
  // render per frame keeps a long answer smooth without losing anything.
  let raf = 0;
  const paint = () => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const stick = atBottom();
      setMarkdown(bubble, acc);
      if (stick) scrollDown(true);
    });
  };

  inflight = new AbortController();
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      signal: inflight.signal,
      body: JSON.stringify({
        message: text, sessionId,
        tools: state.tools, model: state.model,
        effort: state.effort, permissionMode: state.mode,
      }),
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const frames = buf.split("\n\n");
      buf = frames.pop();
      for (const frame of frames) {
        const n = frame.match(/^event: (.+)$/m), d = frame.match(/^data: (.*)$/m);
        if (!n || !d) continue;
        let p = {};
        try { p = JSON.parse(d[1]); } catch { }
        const name = n[1];
        if (name === "session") sessionId = p.sessionId;
        else if (name === "info") resolved = p;
        else if (name === "text") { acc += p.text; paint(); }
        else if (name === "tool") { addToolChip(bubble, p.name); scrollDown(); }
        else if (name === "done") { meta = p; if (!acc && p.result) acc = p.result; paint(); }
        else if (name === "error") addTurn("note bad", p.message || "Unbekannter Fehler");
      }
    }
  } catch (e) {
    if (e.name === "AbortError") aborted = true;
    else addTurn("note bad", String(e));
  }
  finally {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    setMarkdown(bubble, acc);
    body.classList.remove("cursor");
    addCopyButtons(bubble);

    if (aborted) {
      if (!acc) bubble.parentElement.remove();
      addTurn("note", "Abgebrochen");
    } else if (meta) {
      const m = document.createElement("div");
      m.className = "meta";
      const secs = meta.durationMs ? fmtSecs.format(meta.durationMs / 1000) + " s" : "";
      const cost = typeof meta.cost === "number" ? fmtCost.format(meta.cost) : "";
      m.textContent = [resolved?.model || "", secs, cost].filter(Boolean).join(" · ");
      bubble.parentElement.appendChild(m);
      addCost(meta.cost);
    }
    inflight = null;
    setBusy(false); loadAccounts(); scrollDown();
    // Once now for the new entry, once shortly after: Claude Code writes the
    // generated title a moment after the turn ends.
    loadConversations();
    setTimeout(loadConversations, 2500);
    loadCommands();   // the init event may have reported this directory's list
  }
};

/* ---------- attachments ----------
   The "+" mirrors the app's add menu. What it can honestly offer here is a file
   reference: `@path` is expanded by the CLI itself -- measured to work even
   with every tool switched off -- so the file lands in the prompt either way. */

let fileTimer = 0;

async function loadFiles() {
  const q = $("fileSearch").value.trim();
  let d;
  try { d = await (await fetch("/api/files?q=" + encodeURIComponent(q))).json(); }
  catch { return; }
  const host = $("fileItems");
  host.innerHTML = "";
  for (const f of d.files || []) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "item";
    b.innerHTML = `<span class="tick">@</span><span class="label">${esc(f)}</span>`;
    b.onclick = () => insertFile(f);
    host.appendChild(b);
  }
  const shown = (d.files || []).length;
  $("fileHint").textContent = !shown
    ? (q ? "Keine Datei gefunden." : "Keine Dateien in diesem Verzeichnis.")
    : d.total > shown
      ? `${shown} von ${d.total}${d.capped ? "+" : ""} — weiter eingrenzen`
      : "";
}

function insertFile(rel) {
  const inp = $("input");
  const sep = inp.value && !inp.value.endsWith(" ") ? " " : "";
  inp.value += sep + "@" + rel + " ";
  closePops();
  inp.focus();
  inp.dispatchEvent(new Event("input"));
}

$("attachBtn").addEventListener("click", () => {
  if (!$("attachPop").classList.contains("open")) return;
  $("fileSearch").value = "";
  loadFiles();
  setTimeout(() => $("fileSearch").focus(), 0);
});
$("fileSearch").addEventListener("input", () => {
  clearTimeout(fileTimer);
  fileTimer = setTimeout(loadFiles, 130);
});
$("attachSlash").onclick = () => {
  closePops();
  const inp = $("input");
  inp.value = "/";
  inp.focus();
  inp.dispatchEvent(new Event("input"));
};

/* ---------- slash commands ----------
   These are real: in print mode `/context` returns a report rather than an
   echo, so the palette offers what the CLI itself listed for this directory. */

let cmdAll = [];      // {name, description}
let cmdHits = [];     // currently filtered
let cmdIndex = 0;

async function loadCommands() {
  try {
    const d = await (await fetch("/api/commands")).json();
    cmdAll = d.commands || [];
  } catch { cmdAll = []; }
}

/** The command token being typed, or null when the palette should stay shut.
    Only a leading slash counts, and only until the first space -- once an
    argument is being written the palette is out of the way. */
function commandPrefix() {
  const v = $("input").value;
  if (!v.startsWith("/")) return null;
  const token = v.slice(1);
  if (/\s/.test(token)) return null;
  return token;
}

function closeCmd() {
  $("cmdPop").classList.remove("open");
  cmdHits = [];
}

function renderCmd() {
  const prefix = commandPrefix();
  if (prefix === null || !cmdAll.length) { closeCmd(); return; }
  const q = prefix.toLowerCase();
  cmdHits = cmdAll.filter(c => c.name.toLowerCase().includes(q)).slice(0, 40);
  if (!cmdHits.length) { closeCmd(); return; }
  if (cmdIndex >= cmdHits.length) cmdIndex = 0;

  const host = $("cmdItems");
  host.innerHTML = "";
  cmdHits.forEach((c, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "cmd"; b.role = "option";
    b.setAttribute("aria-selected", String(i === cmdIndex));
    b.innerHTML = `<span class="n">/${esc(c.name)}</span>
                   <span class="h">${esc(c.description || "")}</span>`;
    b.onmousedown = (e) => { e.preventDefault(); pickCmd(i); };
    host.appendChild(b);
  });
  closePops("cmdPop");
  $("cmdPop").classList.add("open");
  host.children[cmdIndex]?.scrollIntoView({ block: "nearest" });
}

function pickCmd(i) {
  const c = cmdHits[i];
  if (!c) return;
  // Insert, do not send: a command usually wants an argument, and the app
  // behaves the same way.
  $("input").value = "/" + c.name + " ";
  closeCmd();
  $("input").focus();
  $("input").dispatchEvent(new Event("input"));
}

$("input").addEventListener("input", () => { cmdIndex = 0; renderCmd(); });
$("input").addEventListener("blur", () => setTimeout(closeCmd, 120));

$("input").addEventListener("keydown", (e) => {
  const open = $("cmdPop").classList.contains("open") && cmdHits.length;
  if (open) {
    if (e.key === "ArrowDown") {
      e.preventDefault(); cmdIndex = (cmdIndex + 1) % cmdHits.length; renderCmd(); return;
    }
    if (e.key === "ArrowUp") {
      e.preventDefault(); cmdIndex = (cmdIndex - 1 + cmdHits.length) % cmdHits.length; renderCmd(); return;
    }
    if (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey)) {
      e.preventDefault(); pickCmd(cmdIndex); return;
    }
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeCmd(); return; }
  }
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("input").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 220) + "px";
});

$("newChat").onclick = () => {
  if (busy) return;
  sessionId = null;
  currentConv = null;
  log.innerHTML = '<div class="empty" id="empty">Womit fangen wir an?</div>';
  markActiveConv();
  $("input").focus();
};

/* ---------- conversation history ----------
   The list comes from Claude Code's own transcripts, so it survives restarts
   and also shows conversations started in a terminal. Opening one re-displays
   it and adopts its id, which means the next message continues it through
   `--resume` rather than replaying anything. */

const rtf = new Intl.RelativeTimeFormat("de-DE", { numeric: "auto" });
function whenLabel(epochSeconds) {
  const diff = (epochSeconds * 1000 - Date.now()) / 1000;
  const steps = [[60, "second"], [3600, "minute"], [86400, "hour"], [604800, "day"]];
  const divs = [1, 60, 3600, 86400];
  for (let i = 0; i < steps.length; i++) {
    if (Math.abs(diff) < steps[i][0]) return rtf.format(Math.round(diff / divs[i]), steps[i][1]);
  }
  return new Date(epochSeconds * 1000).toLocaleDateString("de-DE",
    { day: "2-digit", month: "2-digit", year: "2-digit" });
}

/** Calendar-day buckets, like the app's history: today and yesterday are their
    own groups, then coarser ones. Compared by day, not by elapsed hours. */
function groupOf(epochSeconds) {
  const d = new Date(epochSeconds * 1000);
  const midnight = new Date(); midnight.setHours(0, 0, 0, 0);
  const days = Math.floor((midnight - d) / 86400000);
  if (days <= 0) return "Heute";
  if (days === 1) return "Gestern";
  if (days < 7) return "Letzte 7 Tage";
  if (days < 30) return "Letzte 30 Tage";
  return "Älter";
}

const shortDir = (p) => (p || "").split(/[\\/]/).filter(Boolean).slice(-2).join("\\");

let convRows = [];
let convScope = localStorage.getItem("ui.scope") === "all" ? "all" : "dir";
let currentConv = null;   // {id, cwd} of the opened conversation, for reloading

function markActiveConv() {
  for (const el of document.querySelectorAll(".conv")) {
    el.setAttribute("aria-current", String(el.dataset.id === sessionId));
  }
}

function renderConvs() {
  const host = $("convs");
  const q = $("convSearch").value.trim().toLowerCase();
  const rows = q
    ? convRows.filter(s => s.title.toLowerCase().includes(q)
                        || (s.cwd || "").toLowerCase().includes(q))
    : convRows;

  if (!rows.length) {
    host.innerHTML = `<div class="none">${
      q ? "Nichts gefunden." :
      convScope === "all" ? "Noch keine Gespräche."
                          : "Keine Gespräche in diesem Verzeichnis."}</div>`;
    return;
  }
  host.innerHTML = "";
  let group = null;
  for (const s of rows) {
    const g = groupOf(s.updatedAt);
    if (g !== group) {
      group = g;
      const h = document.createElement("div");
      h.className = "grp"; h.textContent = g;
      host.appendChild(h);
    }
    const b = document.createElement("button");
    b.type = "button"; b.className = "conv"; b.dataset.id = s.id;
    b.setAttribute("aria-current", String(s.id === sessionId));
    b.title = s.cwd || "";
    const where = convScope === "all" && s.cwd
      ? `<div class="where">${esc(shortDir(s.cwd))}</div>` : "";
    b.innerHTML = `<div class="t">${esc(s.title)}</div>
                   <div class="d">${esc(whenLabel(s.updatedAt))} · ${s.turns} ${s.turns === 1 ? "Frage" : "Fragen"}</div>
                   ${where}`;
    b.onclick = () => openConversation(s.id, s.cwd);
    host.appendChild(b);
  }
}

async function loadConversations() {
  try {
    const data = await (await fetch("/api/sessions?scope=" + convScope)).json();
    convRows = data.sessions || [];
  } catch { return; }
  renderConvs();
}

function setScope(scope) {
  convScope = scope;
  localStorage.setItem("ui.scope", scope);
  $("scopeDir").setAttribute("aria-pressed", String(scope === "dir"));
  $("scopeAll").setAttribute("aria-pressed", String(scope === "all"));
  loadConversations();
}

async function openConversation(id, cwd, limit) {
  if (busy) return;
  // --resume resolves an id relative to the working directory, so a
  // conversation from elsewhere has to move the session there first.
  if (cwd && ctx && cwd !== ctx.cwd) {
    try {
      const d = await (await fetch("/api/cwd", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cwd }),
      })).json();
      if (d.error) { addTurn("note bad", d.error); return; }
      applyContext(d);
    } catch (e) { addTurn("note bad", String(e)); return; }
  }

  const url = "/api/session?id=" + encodeURIComponent(id)
            + (limit === undefined ? "" : "&limit=" + limit);
  let data;
  try { data = await (await fetch(url)).json(); }
  catch (e) { addTurn("note bad", String(e)); return; }
  if (data.error) { addTurn("note bad", data.error); return; }

  log.innerHTML = "";
  if (data.truncated) {
    const hidden = data.total - data.messages.length;
    const box = document.createElement("div");
    box.className = "trunc";
    box.innerHTML = `${hidden} ältere Beiträge nicht geladen · `;
    const btn = document.createElement("button");
    btn.type = "button"; btn.textContent = "Alle laden";
    btn.onclick = () => openConversation(id, cwd, 0);
    box.appendChild(btn);
    log.appendChild(box);
  }
  for (const m of data.messages) {
    if (m.role === "user") addTurn("user", m.text);
    else addCopyButtons(addTurn("claude", m.text));
  }
  if (!data.messages.length) addTurn("note", "Dieses Gespräch enthält keinen sichtbaren Verlauf.");
  sessionId = id;
  currentConv = { id, cwd };
  markActiveConv();
  scrollDown(true);
  $("input").focus();
}

$("convSearch").addEventListener("input", renderConvs);
$("convSearch").addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.stopPropagation(); e.target.value = ""; renderConvs(); }
});
$("scopeDir").onclick = () => setScope("dir");
$("scopeAll").onclick = () => setScope("all");
setScope(convScope);

$("railToggle").onclick = () => {
  const hidden = document.body.classList.toggle("no-rail");
  localStorage.setItem("ui.rail", hidden ? "off" : "on");
  if (!hidden) loadConversations();
};
if (localStorage.getItem("ui.rail") === "off") document.body.classList.add("no-rail");

document.addEventListener("keydown", (e) => {
  // Ctrl+K jumps to the history search, Alt+N starts a conversation. Alt+N
  // rather than Ctrl+N: the browser owns that one and will not give it up.
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    document.body.classList.remove("no-rail");
    localStorage.setItem("ui.rail", "on");
    $("convSearch").focus(); $("convSearch").select();
  } else if (e.altKey && e.key.toLowerCase() === "n") {
    e.preventDefault();
    $("newChat").click();
  }
});

/* ---------- boot ---------- */

syncPills();
loadAccounts();   // the history list is loaded by setScope() above
loadCommands();
fetch("/api/context").then(r => r.json()).then(applyContext).catch(() => { });
setInterval(() => { if (!busy) loadAccounts(); }, 30000);
$("input").focus();
</script>
</body>
</html>
